name: MiniVectorDB score validation
on:
  push:
    branches: [codex/round2-score-20261111, codex/round2-optimize-20261112]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MVDB_FINAL_PERFORMANCE: ${{ contains(github.event.head_commit.message, '[final-perf]') && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Engine, Docker and official protocol
        run: bash minivec/tools/ci_score.sh
      - name: Show diagnostic reports
        if: always()
        run: |
          if [ -d protocol-results ]; then find protocol-results -name result.json -exec cat {} \;; fi
          if [ -d protocol-results ]; then find protocol-results -name "*.stderr.log" -exec tail -30 {} \;; fi
  paired-performance:
    if: ${{ !contains(github.event.head_commit.message, '[validation-only]') && !contains(github.event.head_commit.message, '[standard]') && !contains(github.event.head_commit.message, '[hotpath]') && !contains(github.event.head_commit.message, '[round2]') && !contains(github.event.head_commit.message, '[dot]') && !contains(github.event.head_commit.message, '[pgo]') && !contains(github.event.head_commit.message, '[dot-avx2]') && !contains(github.event.head_commit.message, '[final-perf]') && !contains(github.event.head_commit.message, '[report-a]') && !contains(github.event.head_commit.message, '[report-b]') && !contains(github.event.head_commit.message, '[pgo-matrix]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Fixed compiler baseline and candidate paired measurement
        run: bash minivec/tools/ci_iteration.sh
  standard-performance:
    if: ${{ contains(github.event.head_commit.message, '[standard]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Representative 10k workload and isolated LTO comparison
        run: bash minivec/tools/ci_standard.sh
  hotpath-performance:
    if: ${{ contains(github.event.head_commit.message, '[hotpath]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Exact-query hot path and boundary paired measurement
        run: bash minivec/tools/ci_hotpath.sh
  round2-performance:
    if: ${{ contains(github.event.head_commit.message, '[round2]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Separate parser and residual-bound experiments
        run: bash minivec/tools/ci_round2.sh
  dot-performance:
    if: ${{ contains(github.event.head_commit.message, '[dot]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Integrated exact integer-dot comparison
        run: bash minivec/tools/ci_dot.sh
  pgo-performance:
    if: ${{ contains(github.event.head_commit.message, '[pgo]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Profile-guided build, correctness and paired measurement
        run: bash minivec/tools/ci_pgo.sh
  dot-avx2-performance:
    if: ${{ contains(github.event.head_commit.message, '[dot-avx2]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Forced AVX2 integer dispatcher and dot ablation
        run: bash minivec/tools/ci_dot_avx2.sh
  report-a-performance:
    if: ${{ contains(github.event.head_commit.message, '[report-a]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Report I05 I08 isolated comparisons and expanded matrix
        run: bash minivec/tools/ci_report_stage_a.sh
  report-b-hotpaths:
    if: ${{ contains(github.event.head_commit.message, '[report-b]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Independent query candidates and cgroup resources
        run: bash minivec/tools/ci_report_stage_b.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: report-b-hotpaths
          path: report-b-results/
          retention-days: 90
  report-b-storage:
    if: ${{ contains(github.event.head_commit.message, '[report-b]') || contains(github.event.head_commit.message, '[storage-report]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Delta and spilled-filter budgets and failure boundaries
        run: bash minivec/tools/ci_storage_report.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: report-b-storage
          path: storage-report-results/
          retention-days: 90
  pgo-matrix:
    if: ${{ contains(github.event.head_commit.message, '[pgo-matrix]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Same-source O3 LTO PGO and actual spill training
        run: bash minivec/tools/ci_pgo_matrix.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pgo-matrix
          path: pgo-matrix-results/
          retention-days: 90
  report-b-quantization:
    if: ${{ contains(github.event.head_commit.message, '[report-b]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Block scales numeric and budget gates and paired diagnostics
        run: bash minivec/tools/ci_quant_scale.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: report-b-quantization
          path: quant-scale-results/
          retention-days: 90
  report-c-parser:
    if: ${{ contains(github.event.head_commit.message, '[report-c]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Bounded owning-token reuse correctness allocations and timings
        run: bash minivec/tools/ci_parser_reuse.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: report-c-parser
          path: parser-reuse-results/
          retention-days: 90
  report-c-projection:
    if: ${{ contains(github.event.head_commit.message, '[report-c]') || contains(github.event.head_commit.message, '[projection-report]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Wide typed output and mid-response UTF8 failures
        run: bash minivec/tools/ci_projection_report.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: report-c-projection
          path: projection-report-results/
          retention-days: 90
  report-c-filter:
    if: ${{ contains(github.event.head_commit.message, '[report-c]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Filter factorial confirmation and separately instrumented mechanisms
        run: bash minivec/tools/ci_filter_report.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: report-c-filter
          path: filter-report-results/
          retention-days: 90
  parser-pgo-confirmation:
    if: ${{ contains(github.event.head_commit.message, '[feature-confirm]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Owning-token reuse under independent original PGO profiles
        run: CONFIRM_FEATURE=parser bash minivec/tools/ci_parser_confirmation.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: parser-pgo-confirmation
          path: parser-confirmation-results/
          retention-days: 90
  typed-pgo-confirmation:
    if: ${{ contains(github.event.head_commit.message, '[feature-confirm]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Typed JSON output under independent original PGO profiles
        run: CONFIRM_FEATURE=typed bash minivec/tools/ci_parser_confirmation.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: typed-pgo-confirmation
          path: typed-confirmation-results/
          retention-days: 90
  selective-quantization:
    if: ${{ contains(github.event.head_commit.message, '[selective-scale]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Selective block-scale gates and whole-request confirmation
        run: bash minivec/tools/ci_selective_scale.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: selective-quantization
          path: selective-scale-results/
          retention-days: 90
  spill-pgo-confirmation:
    if: ${{ contains(github.event.head_commit.message, '[feature-confirm]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Spilled scalar cache PGO whole-request and selective workload confirmation
        run: CONFIRM_FEATURE=spill bash minivec/tools/ci_parser_confirmation.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: spill-pgo-confirmation
          path: spill-confirmation-results/
          retention-days: 90
  storage-lifecycle-gates:
    if: ${{ contains(github.event.head_commit.message, '[storage-gates]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Spilled cache rollback slot-reuse and existing storage gates
        run: STORAGE_CORRECTNESS_ONLY=1 bash minivec/tools/ci_storage_report.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: storage-lifecycle-gates
          path: storage-report-results/
          retention-days: 90
  filter-fixed-thread-repeat:
    if: ${{ contains(github.event.head_commit.message, '[filter-repeat]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Interleaved fixed-thread factorial and identical-binary controls
        run: bash minivec/tools/ci_filter_repeat.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: filter-fixed-thread-repeat
          path: filter-repeat-results/
          retention-days: 90
  typed-pgo-atomicity:
    if: ${{ contains(github.event.head_commit.message, '[typed-gates]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: PGO binary UTF8 failure atomicity with source and profile proof
        run: CONFIRM_FEATURE=typed FEATURE_CORRECTNESS_ONLY=1 bash minivec/tools/ci_parser_confirmation.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: typed-pgo-atomicity
          path: typed-confirmation-results/
          retention-days: 90
  report-integration:
    if: ${{ contains(github.event.head_commit.message, '[report-integration]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Retained baseline versus integrated spill cache and typed output
        run: bash minivec/tools/ci_report_integration.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: report-integration
          path: integration-report-results/
          retention-days: 90
  output-guard-ablation:
    if: ${{ contains(github.event.head_commit.message, '[output-guard]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Same-host PGO spill-only broad and guarded projection comparisons
        run: bash minivec/tools/ci_output_guard.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: output-guard-ablation
          path: output-guard-results/
          retention-days: 90
