name: MiniVectorDB score validation
on:
  push:
    branches: [codex/round2-score-20261111, codex/round2-optimize-20261112]
  workflow_dispatch:
    inputs:
      matched_insert_roots:
        description: Two original matched R2 N2 root PGO builds and eight default-policy pairs
        type: boolean
        required: false
        default: false
      insert_thread_control:
        description: Import existing R/N and diagnose thread sensitivity in eight pairs without rebuilding
        type: boolean
        required: false
        default: false
      insert_copy:
        description: One actual root build, 24 exact low-resource pairs versus retained and imported highest programs
        type: boolean
        required: false
        default: false
      highest_compare:
        description: Rebuild historical best-score root and compare retained/CRC programs on one runner
        type: boolean
        required: false
        default: false
      small_bridge:
        description: Build and gate actual root image, then run 12 one-CPU and 8 two-CPU pairs
        type: boolean
        required: false
        default: false
      small_compute:
        description: Run 12 single-CPU pairs using the verified submitted-source binary
        type: boolean
        required: false
        default: false
      small_compute_policy:
        description: Single-query-thread control or retain startup calibration without fanout
        type: choice
        options: [serial, no-fanout]
        default: serial
      bulk_guard:
        description: Confirm short-circuited bulk admission with 192 paired runs
        type: boolean
        required: false
        default: false
      bulk_typed:
        description: Confirm bounded bulk vector output against the delivered PGO baseline
        type: boolean
        required: false
        default: false
      regression_ablation:
        description: Compare isolated regression fixes against the delivered four-feature PGO build
        type: boolean
        required: false
        default: false
      output_guard:
        description: Run the 63-pair output guard comparison
        type: boolean
        required: false
        default: false
      six_finish:
        description: Run mixed index delta and write-query lifecycle confirmation
        type: boolean
        required: false
        default: false
      filter_reuse:
        description: Run 30 paired write-query tests for delayed multi-filter reuse
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  validate:
    # This diagnostic reuses an already validated binary; it makes no claim
    # about a new root-image build and deliberately avoids another PGO build.
    if: ${{ !inputs.matched_insert_roots && !contains(github.event.head_commit.message, '[matched-insert-roots]') && !inputs.insert_thread_control && !contains(github.event.head_commit.message, '[insert-thread-control]') && !inputs.highest_compare && !contains(github.event.head_commit.message, '[highest-compare]') && !inputs.small_compute && !contains(github.event.head_commit.message, '[small-compute]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MVDB_FINAL_PERFORMANCE: ${{ contains(github.event.head_commit.message, '[final-perf]') && '1' || '0' }}
      MVDB_SMALL_BRIDGE: ${{ (inputs.small_bridge || contains(github.event.head_commit.message, '[small-bridge]')) && '1' || '0' }}
      MVDB_INSERT_COPY_SCREEN: ${{ (inputs.insert_copy || contains(github.event.head_commit.message, '[insert-copy]')) && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Engine, Docker and official protocol
        run: bash minivec/tools/ci_score.sh
      - name: Show diagnostic reports
        if: always()
        run: |
          if [ -d protocol-results ]; then find protocol-results -name result.json -exec cat {} \;; fi
          if [ -d protocol-results ]; then find protocol-results -name "*.stderr.log" -exec tail -30 {} \;; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: root-image-validation
          path: protocol-results/
          include-hidden-files: true
          retention-days: 90
  paired-performance:
    if: ${{ !inputs.matched_insert_roots && !contains(github.event.head_commit.message, '[matched-insert-roots]') && !inputs.insert_thread_control && !contains(github.event.head_commit.message, '[insert-thread-control]') && !inputs.insert_copy && !contains(github.event.head_commit.message, '[insert-copy]') && !inputs.highest_compare && !contains(github.event.head_commit.message, '[highest-compare]') && !inputs.small_bridge && !contains(github.event.head_commit.message, '[small-bridge]') && !inputs.small_compute && !contains(github.event.head_commit.message, '[small-compute]') && !inputs.bulk_guard && !contains(github.event.head_commit.message, '[bulk-guard]') && !inputs.bulk_typed && !contains(github.event.head_commit.message, '[bulk-typed]') && !inputs.regression_ablation && !contains(github.event.head_commit.message, '[regression-ablation]') && !inputs.output_guard && !inputs.six_finish && !inputs.filter_reuse && !contains(github.event.head_commit.message, '[validation-only]') && !contains(github.event.head_commit.message, '[standard]') && !contains(github.event.head_commit.message, '[hotpath]') && !contains(github.event.head_commit.message, '[round2]') && !contains(github.event.head_commit.message, '[dot]') && !contains(github.event.head_commit.message, '[pgo]') && !contains(github.event.head_commit.message, '[dot-avx2]') && !contains(github.event.head_commit.message, '[final-perf]') && !contains(github.event.head_commit.message, '[report-a]') && !contains(github.event.head_commit.message, '[report-b]') && !contains(github.event.head_commit.message, '[pgo-matrix]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Fixed compiler baseline and candidate paired measurement
        run: bash minivec/tools/ci_iteration.sh
  highest-compare:
    if: ${{ inputs.highest_compare || contains(github.event.head_commit.message, '[highest-compare]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Historical root build and direct exact low-resource comparisons
        run: bash minivec/tools/ci_highest_compare.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: highest-compare
          path: protocol-results/highest-compare/
          include-hidden-files: true
          retention-days: 90
  insert-thread-control:
    if: ${{ inputs.insert_thread_control || contains(github.event.head_commit.message, '[insert-thread-control]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Same-runner R N default and single-thread diagnostic without rebuilding
        run: bash minivec/tools/ci_insert_thread_control.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: insert-thread-control
          path: insert-thread-control-results/
          include-hidden-files: true
          retention-days: 90
  matched-insert-roots:
    if: ${{ inputs.matched_insert_roots || contains(github.event.head_commit.message, '[matched-insert-roots]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Matched original R2 N2 root builds actual-image gates and eight pairs
        run: bash minivec/tools/ci_matched_insert_roots.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: matched-insert-roots
          path: matched-insert-root-results/
          include-hidden-files: true
          retention-days: 90
  small-compute:
    if: ${{ inputs.small_compute || contains(github.event.head_commit.message, '[small-compute]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MVDB_SMALL_COMPUTE_POLICY: ${{ inputs.small_compute_policy || (contains(github.event.head_commit.message, '[no-fanout]') && 'no-fanout' || 'serial') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Submitted-source program, default versus declared query policy, 12 pairs
        run: bash minivec/tools/ci_small_compute.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: small-compute
          path: small-compute-results/
          retention-days: 90
  regression-ablation:
    if: ${{ inputs.regression_ablation || contains(github.event.head_commit.message, '[regression-ablation]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Isolated PGO candidates, unchanged-program controls and benefit guards
        run: bash minivec/tools/ci_regression_ablation.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: regression-ablation
          path: regression-ablation-results/
          retention-days: 90
  bulk-typed-confirmation:
    if: ${{ inputs.bulk_typed || contains(github.event.head_commit.message, '[bulk-typed]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Bulk vector output guards, independent PGO and paired protection cases
        run: bash minivec/tools/ci_bulk_typed_confirmation.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bulk-typed-confirmation
          path: bulk-typed-confirmation-results/
          retention-days: 90
  bulk-guard-confirmation:
    if: ${{ inputs.bulk_guard || contains(github.event.head_commit.message, '[bulk-guard]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Short-circuited bulk admission, 150 candidate pairs and 42 same-program controls
        run: bash minivec/tools/ci_bulk_guard_confirmation.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bulk-guard-confirmation
          path: bulk-guard-confirmation-results/
          retention-days: 90
  standard-performance:
    if: ${{ contains(github.event.head_commit.message, '[standard]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Representative 10k workload and isolated LTO comparison
        run: bash minivec/tools/ci_standard.sh
  hotpath-performance:
    if: ${{ contains(github.event.head_commit.message, '[hotpath]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Exact-query hot path and boundary paired measurement
        run: bash minivec/tools/ci_hotpath.sh
  round2-performance:
    if: ${{ contains(github.event.head_commit.message, '[round2]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Separate parser and residual-bound experiments
        run: bash minivec/tools/ci_round2.sh
  dot-performance:
    if: ${{ contains(github.event.head_commit.message, '[dot]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Integrated exact integer-dot comparison
        run: bash minivec/tools/ci_dot.sh
  pgo-performance:
    if: ${{ contains(github.event.head_commit.message, '[pgo]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Profile-guided build, correctness and paired measurement
        run: bash minivec/tools/ci_pgo.sh
  dot-avx2-performance:
    if: ${{ contains(github.event.head_commit.message, '[dot-avx2]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Forced AVX2 integer dispatcher and dot ablation
        run: bash minivec/tools/ci_dot_avx2.sh
  report-a-performance:
    if: ${{ contains(github.event.head_commit.message, '[report-a]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Report I05 I08 isolated comparisons and expanded matrix
        run: bash minivec/tools/ci_report_stage_a.sh
  report-b-hotpaths:
    if: ${{ contains(github.event.head_commit.message, '[report-b]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Independent query candidates and cgroup resources
        run: bash minivec/tools/ci_report_stage_b.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: report-b-hotpaths
          path: report-b-results/
          retention-days: 90
  report-b-storage:
    if: ${{ contains(github.event.head_commit.message, '[report-b]') || contains(github.event.head_commit.message, '[storage-report]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Delta and spilled-filter budgets and failure boundaries
        run: bash minivec/tools/ci_storage_report.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: report-b-storage
          path: storage-report-results/
          retention-days: 90
  pgo-matrix:
    if: ${{ contains(github.event.head_commit.message, '[pgo-matrix]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Same-source O3 LTO PGO and actual spill training
        run: bash minivec/tools/ci_pgo_matrix.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
