      - name: Mixed mutation delta and complete filter write-query lifecycles
        run: bash minivec/tools/ci_index_delta_complete.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: six-direction-finish
          path: |
            six-direction-results/
            delta-confirmation-results/
            spill-confirmation-results/
            filter-confirmation-results/
          retention-days: 90
  filter-reuse-confirmation:
    if: ${{ inputs.filter_reuse || contains(github.event.head_commit.message, '[filter-reuse]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: First-query legacy filtering and repeated-query cache confirmation
        run: bash minivec/tools/ci_filter_lifecycle_confirmation.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: filter-reuse-confirmation
          path: |
            filter-lifecycle-confirmation-results/
            filter-reuse-confirmation-results/
          retention-days: 90
