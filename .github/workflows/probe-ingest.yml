name: probe ingest
on:
  push:
    branches: [perf/probe-ingest]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: docker build --platform linux/amd64 -t mv:p .
      - run: python3 minivec/tools/probe_ingest.py --image mv:p --commits 100
