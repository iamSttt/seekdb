name: bw mi
on:
  push:
    branches: [perf/bwmi]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  m:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: docker build --platform linux/amd64 -t mv:m .
      - name: Workload then cgroup stats
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/in.jsonl
          import json
          D=128
          v="["+",".join(["0.013"]*D)+"]"
          n=0
          print(json.dumps({"id":n,"op":"execute","sql":"CREATE TABLE t(id BIGINT PRIMARY KEY, grp BIGINT, v VECTOR(%d));"%D,"search_mode":"exact"}))
          for b in range(100):
              rows=",".join("(%d,%d,'%s')"%(100+b*100+k,(b*100+k)%10,v) for k in range(100))
              for s in ("BEGIN;","INSERT INTO t VALUES "+rows+";","COMMIT;"):
                  n+=1; print(json.dumps({"id":n,"op":"execute","sql":s,"search_mode":"exact"}))
          n+=1; print(json.dumps({"id":n,"op":"execute","sql":"CREATE VECTOR INDEX t_v ON t(v);","search_mode":"exact"}))
          for q in range(1000):
              w="" if q%2 else " WHERE grp=%d"%((q//2)%10)
              n+=1; print(json.dumps({"id":n,"op":"execute","sql":"SELECT id,L2_DISTANCE(v,'%s') AS d FROM t%s ORDER BY d LIMIT 10;"%(v,w),"search_mode":"exact"}))
          n+=1; print(json.dumps({"id":n,"op":"shutdown"}))
          PY
          docker rm -f mvt >/dev/null 2>&1 || true
          /usr/bin/time -f "wall=%e user=%U sys=%S maxrss_kb=%M" docker run --name mvt -i --cpus=2 --memory=2g -v /tmp/d:/data mv:m < /tmp/in.jsonl > /tmp/out.jsonl
          CID=$(docker inspect -f '{{.Id}}' mvt)
          SCOPE=$(ls -d /sys/fs/cgroup/system.slice/docker-*$CID*.scope 2>/dev/null | head -1)
          echo "scope=$SCOPE"
          echo "=== memory.peak ==="; cat "$SCOPE/memory.peak" 2>/dev/null || echo NA
          echo "=== io.stat ==="; cat "$SCOPE/io.stat" 2>/dev/null | head -3 || echo NA
          echo "=== 响应行数 ==="; wc -l /tmp/out.jsonl
          echo "=== /data 大小 ==="; du -sb /tmp/d 2>/dev/null
          docker rm -f mvt >/dev/null 2>&1 || true
