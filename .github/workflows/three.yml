name: three way
on:
  push:
    branches: [perf/three]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Build base, v1, v2
        run: |
          set -euo pipefail
          for spec in base:ee299adb296a2922d01982aa6c5707d37e767b41 v1:dd496ae8a8db3d38c56a581c960a46ebb13c2cb5 v2:03cd5298e98eff38eb253f2f7d4b146342510bad; do
            name=${spec%%:*}; ref=${spec##*:}
            if [ ${#ref} -lt 40 ]; then ref=$(git rev-list -n1 --all --grep=. | head -1); fi
            git fetch --depth=1 origin $ref 2>/dev/null || true
            mkdir -p /tmp/$name && git archive $ref | tar -x -C /tmp/$name
            docker build --platform linux/amd64 -t mv:$name /tmp/$name
          done
      - name: Interleaved
        run: |
          set -euo pipefail
          for r in 1 2 3; do
            for v in base v1 v2; do
              echo "### round=$r variant=$v"
              python3 minivec/tools/probe_split.py --image mv:$v --repeat 400
            done
          done
