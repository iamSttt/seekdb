name: noq ab
on:
  push:
    branches: [perf/noq]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build variants
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 -t mv:packed .
          docker build --platform linux/amd64 --build-arg EXTRA_FLAGS=-DMVDB_DISABLE_QUANTIZED_BOUND -t mv:noq .
      - name: Correctness
        run: |
          set -euo pipefail
          make -C minivec -j2 test
      - name: Interleaved
        run: |
          set -euo pipefail
          for r in 1 2 3; do
            for v in packed noq; do
              echo "### round=$r variant=$v"
              python3 minivec/tools/probe_split.py --image mv:$v --repeat 400
            done
          done
