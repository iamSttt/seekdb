name: probe ann
on:
  push:
    branches: [perf/probe-ann]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: docker build --platform linux/amd64 -t mv:ann .
      - run: python3 minivec/tools/probe_ann.py --image mv:ann --repeat 500
